<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Enviar mensaje | Sebastián Rivas</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        /* ==============================
           CONTENEDOR
           ============================== */

        .container {
            max-width: 750px;
            margin: 60px auto;
            padding: 20px;
        }

        /* ==============================
           TARJETA
           ============================== */

        .contact-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .contact-card h1 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 30px;
            text-align: center;
        }

        .contact-card .description {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        /* ==============================
           FORMULARIO
           ============================== */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #374151;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            font-family: Arial, sans-serif;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
        }

        .form-group textarea {
            min-height: 160px;
            resize: vertical;
        }

        /* ==============================
           BOTONES
           ============================== */

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn-send {
            flex: 1;
            border: none;
            background: #2563eb;
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-send:hover {
            background: #1d4ed8;
        }

        .btn-back {
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            border-radius: 8px;
            background: #e5e7eb;
            color: #374151;
            font-weight: bold;
        }

        .btn-back:hover {
            background: #d1d5db;
        }

        /* ==============================
           RESPONSIVE
           ============================== */

        @media (max-width: 600px) {

            .container {
                margin: 20px auto;
            }

            .contact-card {
                padding: 25px 20px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="contact-card">

        <h1>📩 Envíame un mensaje</h1>

        <p class="description">
            ¿Tienes alguna consulta, propuesta o proyecto?
            Puedes escribirme mediante este formulario.
        </p>


        <!-- ==============================
             FORMULARIO
             ============================== -->

        <form th:action="@{/mensaje/enviar}"
              method="post">

            <!-- NOMBRE -->

            <div class="form-group">

                <label for="nombre">
                    Nombre
                </label>

                <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Escribe tu nombre"
                        required>

            </div>


            <!-- CORREO -->

            <div class="form-group">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required>

            </div>


            <!-- ASUNTO -->

            <div class="form-group">

                <label for="asunto">
                    Asunto
                </label>

                <input
                        type="text"
                        id="asunto"
                        name="asunto"
                        placeholder="¿Sobre qué quieres escribirme?"
                        required>

            </div>


            <!-- MENSAJE -->

            <div class="form-group">

                <label for="mensaje">
                    Mensaje
                </label>

                <textarea
                        id="mensaje"
                        name="mensaje"
                        placeholder="Escribe tu mensaje aquí..."
                        required></textarea>

            </div>


            <!-- BOTONES -->

            <div class="buttons">

                <a href="/"
                   class="btn-back">
                    ← Volver
                </a>

                <button
                        type="submit"
                        class="btn-send">
                    📩 Enviar mensaje
                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
