spring.application.name=Taeha


# ==========================================
# CONEXIÓN A MYSQL
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/portafolio?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE
# ==========================================

# Usar 'none' para respetar el esquema y datos importados del archivo SQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==========================================
# THYMELEAF
# ==========================================

spring.thymeleaf.cache=false


# ==========================================
# SERVIDOR Y ARCHIVOS
# ==========================================

server.port=8080

app.upload.dir=uploads

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB